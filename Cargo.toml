[workspace]
resolver = "2"
# Arborescence cible : docs/02-architecture.md §10.
members = [
    "abi",
    "boot/loader",
    "kernel/ntoskrnl",
    "kernel/hal",
    "kernel/ke",
    "kernel/mm",
    "kernel/ob",
    "kernel/ps",
    "kernel/io",
    "kernel/cm",
    "kernel/ex",
    "kernel/lpc",
    "kernel/se",
    "libs/pe",
    "libs/regf",
    "tools/pe-inspect",
    "tools/syscall-gen",
    "tools/mkfat",
    "xtask",
]
# Code mort de l'ancienne architecture (ADR-019), hors du workspace en attendant
# sa suppression après extraction de la connaissance (audit §5 et §6).
exclude = [
    "win32",
    "directx",
]

[workspace.package]
version     = "0.1.0"
edition     = "2021"
authors     = ["micro-nt-os contributors"]
license     = "MIT"

# Shared kernel-mode profile: small, no unwind, abort on panic
[profile.kernel]
inherits        = "release"
panic           = "abort"
opt-level       = "s"
lto             = true
codegen-units   = 1
debug           = false

[profile.dev]
panic = "abort"

[profile.release]
panic           = "abort"
lto             = true
codegen-units   = 1

# Workspace-wide dependencies (kernel crates share these versions)
[workspace.dependencies]
# HAL / low-level
x86_64          = { version = "0.15", default-features = false, features = ["nightly", "instructions"] }
uart_16550      = { version = "0.3",  default-features = false }
# Tools only (ADR-016): no workspace member uses it; the kernel has
# hal::sync (KSpinLock, IrqLock, Once). Kept for the excluded win32/ code.
spin            = { version = "0.9",  default-features = false, features = ["lazy", "spin_mutex", "once"] }
bitflags        = { version = "2.4",  default-features = false }
# Memory
# Kernel heap: mm::pool (no allocator crate, ADR-016).
# Boot
uefi            = { version = "0.26", features = ["alloc", "global_allocator", "logger"] }
# PE parsing (user-mode tool only)
pelite          = { version = "0.10" }
# Logging (no_std)
log             = { version = "0.4", default-features = false }
