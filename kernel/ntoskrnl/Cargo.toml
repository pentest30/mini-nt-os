[package]
name    = "ntoskrnl"
version.workspace = true
edition.workspace = true

[[bin]]
name = "ntoskrnl"
path = "src/main.rs"
# no_std binary with its own panic handler: it cannot be linked into the
# std test harness, and it has no unit tests (they live in the library crates).
test  = false
bench = false

[features]
# Trace Win32 syscalls on the serial port at dispatch. Debugging only:
# unconditional logging on the syscall hot path is not allowed (06 §5).
trace-syscalls = []
# Overflow the boot thread's kernel stack right after the switch to guarded
# stacks: the boot must end on the STOP screen, not a triple fault (M0).
test-stack-overflow = []
# Two kernel threads exchange 10 000 round trips through two events, after
# the boot self-tests (M1 exit criterion, scenario tests/boot/ke-events).
test-ke-events = []
# Four kernel threads compute in floating point in parallel and must get the
# host's results (M1 exit criterion, scenario tests/boot/fpu).
test-fpu = []
# Timer ISR heartbeat on the serial port (hal), to tell a hang from a crawl.
heartbeat = ["hal/heartbeat"]

[dependencies]
abi              = { path = "../../abi" }
hal              = { path = "../hal" }
ke               = { path = "../ke" }
mm               = { path = "../mm" }
ob               = { path = "../ob" }
ps               = { path = "../ps" }
io-manager       = { path = "../io" }
x86_64           = { workspace = true }
log              = { workspace = true }
