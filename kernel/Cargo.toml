[package]
name    = "kernel"
version.workspace = true
edition.workspace = true

[[bin]]
name = "kernel"
path = "src/main.rs"
# no_std binary with its own panic handler: it cannot be linked into the
# std test harness, and it has no unit tests (they live in the library crates).
test  = false
bench = false

[features]
# Trace Win32 syscalls on the serial port at dispatch. Debugging only:
# unconditional logging on the syscall hot path is not allowed (06 §5).
trace-syscalls = []

[dependencies]
boot-info        = { path = "../boot-info" }
hal              = { path = "../hal" }
ke               = { path = "../executive/ke" }
mm               = { path = "../executive/mm" }
ob               = { path = "../executive/ob" }
ps               = { path = "../executive/ps" }
io-manager       = { path = "../executive/io" }
x86_64           = { workspace = true }
spin             = { workspace = true }
log              = { workspace = true }
bump-alloc       = { path = "../bump-alloc" }
